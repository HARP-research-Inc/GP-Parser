services:
  openccg:
    build: .
    container_name: openccg
    tty: true
    stdin_open: true
    environment:
      - OPENCCG_HOME=/opt/openccg
    # If you want the GUI later, uncomment and setup X11 forwarding:
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    # environment:
    #   - DISPLAY=${DISPLAY}
